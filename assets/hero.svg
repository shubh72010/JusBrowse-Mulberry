<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#A6E3A1" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A6E3A1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A6E3A1" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#A6E3A1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A6E3A1" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A6E3A1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="32" fill="#0A0C0F"/>
  <rect width="1200" height="420" rx="32" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045">
    <path d="M0 105H1200M0 210H1200M0 315H1200M200 0V420M400 0V420M600 0V420M800 0V420M1000 0V420"/>
  </g>

  <!-- browser card motif -->
  <g>
    <rect x="830" y="90" width="270" height="240" rx="28" fill="#1E2022" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <rect x="854" y="114" width="222" height="14" rx="7" fill="#FFFFFF" opacity="0.14"/>
    <rect x="854" y="140" width="150" height="14" rx="7" fill="#A6E3A1" opacity="0.35"/>
    <rect x="854" y="170" width="222" height="120" rx="12" fill="#0A0C0F" opacity="0.85"/>
    <circle cx="880" cy="316" r="6" fill="#A6E3A1" opacity="0.8"/>
    <rect x="896" y="311" width="90" height="10" rx="5" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- wordmark -->
  <circle cx="112" cy="176" r="14" fill="#A6E3A1">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="142" y="192" font-size="72" font-weight="bold" letter-spacing="1" fill="url(#titleGrad)">JusBrowse</text>
  <text x="144" y="232" font-size="21" fill="#FFFFFF" opacity="0.62">Firefox Android, reimagined.</text>

  <!-- pills -->
  <g font-size="15" letter-spacing="2">
    <rect x="142" y="262" width="132" height="38" rx="19" fill="none" stroke="#A6E3A1" stroke-opacity="0.6"/>
    <text x="208" y="287" text-anchor="middle" fill="#A6E3A1">PRIVATE</text>
    <rect x="286" y="262" width="126" height="38" rx="19" fill="none" stroke="#A6E3A1" stroke-opacity="0.6"/>
    <text x="349" y="287" text-anchor="middle" fill="#A6E3A1">THEMED</text>
    <rect x="424" y="262" width="208" height="38" rx="19" fill="none" stroke="#A6E3A1" stroke-opacity="0.6"/>
    <text x="528" y="287" text-anchor="middle" fill="#A6E3A1">TELEMETRY-FREE</text>
  </g>

  <text x="142" y="348" font-size="15" fill="#FFFFFF" opacity="0.35">com.jusdots.jusbrowse · pre-alpha</text>
</svg>
